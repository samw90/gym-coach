<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cassie's Gym Coach</title>
<meta name="description" content="A personal, phone-first coach for machine training.">
<meta name="theme-color" content="#FBF8F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151213" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,100;1,9..144,300..600,100&family=Figtree:wght@400;500;600;700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
:root{
  --bg:#FBF8F2; --surface:#FFFEFA; --cream-2:#F3ECE1;
  --blush:#F2E3E1; --blush-2:#E6CDCB; --mauve-soft:#E4D2D8;
  --ink:#161213; --on-ink:#FFFEFA; --muted:#706466;
  --line:#161213; --hair:#E7DED2;
  --rose:#8C3A48; --good:#5E7A63; --warn:#A0703A;
  --merlot:#7B2F3B; --merlot-soft:#F2E3E2;
  --plum:#6A4254; --plum-soft:#EEE6EB;
  --cafe:#D6B79B; --cafe-soft:#F4EBDF;
  --ochre:#C9A04E; --butter-soft:#F7F0DE;
  --apricot:#DDA682; --apricot-soft:#F8EBE1;
  --sage:#8E9C86; --sage-soft:#ECF0E7;
  --lilac:#A69DB6; --gold:#B8975A; --gold-soft:#EFE5D0;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#151213; --surface:#1D191A; --cream-2:#29231F;
  --blush:#33262A; --blush-2:#4A3439; --mauve-soft:#3E2C35;
  --ink:#F4EDE3; --on-ink:#151213; --muted:#B8AAA4;
  --line:#CDBFB3; --hair:#3A3230;
  --rose:#E0A0AE; --good:#A5C3AC; --warn:#DDB57B;
  --merlot:#C9707F; --merlot-soft:#35222A;
  --plum:#B58FA2; --plum-soft:#2E2430;
  --cafe:#C9A98C; --cafe-soft:#2C2520;
  --ochre:#D8B465; --butter-soft:#2E2A1E;
  --apricot:#E0AE8C; --apricot-soft:#33271F;
  --sage:#A5B39C; --sage-soft:#232A24;
  --lilac:#B9B0C9; --gold:#D0B27A; --gold-soft:#3A3222;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151213; --surface:#1D191A; --cream-2:#29231F;
  --blush:#33262A; --blush-2:#4A3439; --mauve-soft:#3E2C35;
  --ink:#F4EDE3; --on-ink:#151213; --muted:#B8AAA4;
  --line:#CDBFB3; --hair:#3A3230;
  --rose:#E0A0AE; --good:#A5C3AC; --warn:#DDB57B;
  --merlot:#C9707F; --merlot-soft:#35222A;
  --plum:#B58FA2; --plum-soft:#2E2430;
  --cafe:#C9A98C; --cafe-soft:#2C2520;
  --ochre:#D8B465; --butter-soft:#2E2A1E;
  --apricot:#E0AE8C; --apricot-soft:#33271F;
  --sage:#A5B39C; --sage-soft:#232A24;
  --lilac:#B9B0C9; --gold:#D0B27A; --gold-soft:#3A3222;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:22px 96px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;font-variation-settings:"SOFT" 100;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:32px;line-height:1.08}
h2{font-size:23px;line-height:1.15}
h3{font-size:17px}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

header.top{display:flex;flex-direction:column;gap:6px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.greet em{font-style:italic;color:var(--rose)}
.affirm{font-family:var(--display);font-style:italic;font-weight:300;font-size:17px;line-height:1.35;color:var(--ink);max-width:40ch;min-height:2.7em;border:0;background:transparent;padding:0;text-align:left;transition:opacity .4s}
.affirm.fade{opacity:0}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.sync{display:flex;align-items:center;gap:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--good);display:inline-block}
.sync.local i{background:var(--warn)}
.sync.unsaved i{background:#B8473D}
.sync.unsaved{color:#9C3B32}

.weekwrap{display:flex;flex-direction:column;gap:8px}
.weekline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.visits{display:flex;gap:5px;align-items:center}
.visits span{width:22px;height:5px;border:1px solid var(--line)}
.visits span.on{background:var(--ink)}
.week{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;border:1px solid var(--line);background:var(--surface)}
.week::-webkit-scrollbar{display:none}
.wk{flex:0 0 100%;display:grid;grid-template-columns:repeat(7,1fr);scroll-snap-align:start;scroll-snap-stop:always}
.weekline .lbl{display:flex;align-items:baseline;gap:8px}
.weekline .linkbtn{font-size:12px;padding:0;white-space:nowrap}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:11.5px;color:var(--muted);border-left:1px solid var(--hair)}
.day:first-child{border-left:0}
.day.today{background:var(--cafe-soft);color:var(--ink)}
.day b{font-weight:600;font-size:14px;color:var(--ink)}
.mark{width:9px;height:9px;border-radius:50%;border:1px solid var(--hair)}
.mark.lower{background:var(--merlot);border-color:var(--merlot)}
.mark.upper{background:var(--plum);border-color:var(--plum)}
.mark.light{background:var(--apricot);border-color:var(--apricot)}
.mark.recovery{background:var(--sage);border-color:var(--sage)}
.mark.mix{background:var(--ochre);border-color:var(--ochre)}
.chip .sugg{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:7px;vertical-align:2px}
.chip[aria-pressed="true"] .sugg{background:var(--gold-soft)}

.panel{background:var(--surface);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:20px}
.q{display:flex;flex-direction:column;gap:9px}
.q-label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600}
.q-label .muted{font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.focus-card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--merlot);padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px}
.focus-card.upper{border-top-color:var(--plum)}
.focus-card.recovery{border-top-color:var(--sage)}
.focus-card.light{border-top-color:var(--apricot)}
.focus-card.mix{border-top-color:var(--gold)}
.focus-card p{margin:0}
.focus-title{font-size:32px;line-height:1.05}
.focus-where{font-size:12.5px;font-weight:600;color:var(--muted)}
.focus-goal .eyebrow{margin-right:6px;font-size:10px}
.focus-alt{display:flex;flex-direction:column;gap:9px;margin-top:8px;padding-top:14px;border-top:1px solid var(--hair)}
.focus-alt .linkbtn{align-self:flex-start;padding:0}
.preview{border:1px solid var(--line);background:var(--surface)}
.pv{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--hair);font-size:14px}
.pv:first-child{border-top:0}
.pv.done{color:var(--muted)}
.stars{display:flex;gap:4px}
.star{border:0;background:transparent;font-size:30px;line-height:1;padding:2px 3px;color:var(--hair);-webkit-text-stroke:1px var(--muted)}
.star.on{color:var(--gold);-webkit-text-stroke:1px var(--gold)}
.hist-stars{color:var(--gold);letter-spacing:1px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn.start{padding:15px 18px;font-size:16px}
body.live header.top, body.live .weekwrap, body.live nav.tabs{display:none}
body.live{padding-top:0;padding-bottom:40px}
.livebar{position:sticky;top:0;z-index:6;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:0 -16px 14px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.livebar .linkbtn{justify-self:start;padding:0;font-size:14px;text-decoration:none;color:var(--ink)}
.lb-t{display:flex;flex-direction:column;align-items:center;line-height:1.2}
.lb-t b{font-family:var(--display);font-weight:400;font-size:18px}
.lb-t span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lb-c{justify-self:end;font-size:15px;font-weight:600}
.prog{border:1px solid var(--line);background:var(--surface)}
.pw{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--hair)}
.pw:first-child{border-top:0}
.pw.cur{background:var(--cafe-soft)}
.pw-n{font-size:12px;font-weight:600;color:var(--muted)}
.pw-ph{display:flex;flex-direction:column;line-height:1.3}
.pw-ph b{font-family:var(--display);font-weight:400;font-size:16px}
.pw-m{display:flex;gap:5px}
.pm{width:12px;height:12px;border:1px solid var(--line);border-radius:50%}
.pm.on.lower{background:var(--merlot)}.pm.on.upper{background:var(--plum)}.pm.on.recovery{background:var(--sage)}
.pm.now{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--gold)}
.upnext{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sugg-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:6px;vertical-align:1px}
.chip{border:1px solid var(--line);background:transparent;border-radius:2px;padding:7px 12px;font-size:14px;font-weight:500;transition:background .15s,color .15s}
.chip:hover{background:var(--cream-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.energy{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line)}
.energy .chip{border:0;border-left:1px solid var(--line);border-radius:0;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.energy .chip:first-child{border-left:0}
.energy .chip .lvl{font-family:var(--display);font-size:22px;line-height:1;font-weight:300}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}
.seg button{border:0;border-left:1px solid var(--line);background:transparent;padding:10px 0;font-weight:600;font-variant-numeric:tabular-nums}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--cream-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;border-top:1px solid var(--hair)}
.switch{width:46px;height:26px;border-radius:999px;border:1px solid var(--line);background:var(--surface);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--sage-soft)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

.plan-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.pill.lower{background:var(--merlot-soft)}
.pill.upper{background:var(--plum-soft)}
.pill.light{background:var(--apricot-soft)}
.pill.recovery{background:var(--sage-soft)}
.pill.mix{background:var(--gold-soft)}
.coachnote{background:var(--butter-soft);border-left:2px solid var(--ochre);padding:12px 14px;font-size:14px}
.coachnote b{font-weight:600}
.list{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--surface)}
.ex{border-top:1px solid var(--hair)}
.ex:first-child{border-top:0}
.ex.done{background:var(--cafe-soft)}
.ex.active{background:var(--mauve-soft);box-shadow:inset 3px 0 0 var(--rose)}
.ex.active .stepper,.ex.active .logbtns button:not([aria-pressed="true"]){background:var(--surface)}
.ex-main{display:grid;grid-template-columns:1fr auto;gap:3px 14px;padding:14px 16px;align-items:center;width:100%;text-align:left;border:0;background:transparent}
.ex-name{font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:9px}
.check{width:17px;height:17px;border-radius:50%;border:1px solid var(--line);display:inline-grid;place-items:center;font-size:10px;flex:none}
.ex.done .check{background:var(--ink);color:var(--on-ink)}
.ex-rx{font-size:13.5px;color:var(--muted);padding-left:26px}
.ex-w{grid-row:1 / span 2;grid-column:2;text-align:right}
.ex-w .big{font-family:var(--display);font-size:28px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.ex-w .unit{font-size:12px;color:var(--muted);margin-left:2px}
.ex-w .tag{display:block;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.tag.up{color:var(--good)} .tag.down{color:var(--warn)} .tag.new{color:var(--rose)}
.lastnote{border-left:2px solid var(--gold);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.lastnote p{margin:0}
.lastnote .eyebrow{margin-right:6px;font-size:10px}
.ln-plan{font-weight:600}


/* guided set flow */
.flow{border-top:1px dashed var(--hair);padding:16px;display:flex;flex-direction:column;gap:14px}
.cue{font-size:13.5px;color:var(--muted)}
.sethead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sethead h3{font-size:22px}
.ticks{display:flex;gap:5px}
.ticks span{width:26px;height:6px;border:1px solid var(--line)}
.ticks span.on{background:var(--ink)}
.ticks span.now{background:var(--gold-soft);border-color:var(--gold)}
.target{font-size:14px}
.target b{font-family:var(--display);font-weight:400;font-size:19px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{border:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg)}
.stepper .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px 0}
.stepper .ctl{display:grid;grid-template-columns:52px 1fr 52px;align-items:center}
.stepper button{border:0;background:transparent;font-size:26px;height:58px;font-weight:300;user-select:none;-webkit-user-select:none}
.stepper button:active{background:var(--cafe-soft)}
.stepper input{border:0;background:transparent;text-align:center;font-family:var(--display);font-size:30px;font-weight:300;width:100%;min-width:0;padding:4px 0;font-variant-numeric:tabular-nums;color:var(--ink);-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.logbtns{display:grid;grid-template-columns:1fr 1.3fr 1fr;border:1px solid var(--line)}
.logbtns button{border:0;border-left:1px solid var(--line);background:var(--surface);padding:14px 4px;font-weight:600;font-size:14.5px}
.logbtns button:first-child{border-left:0}
.logbtns button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.btn.logset{padding:14px 18px;font-size:15.5px}
.logbtns button:active{background:var(--cafe-soft);color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted)}
.logged{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.setrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--hair);font-size:14px}
.setrow .g{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--hair);padding:1px 7px;border-radius:999px;color:var(--muted)}
.setrow .g.easy{color:var(--good);border-color:var(--good)}
.setrow .g.hard{color:var(--warn);border-color:var(--warn)}
.setedit{display:flex;flex-direction:column;gap:10px;padding:12px;margin:6px 0;border:1px dashed var(--line);background:var(--bg)}
.setedit .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.setedit input{width:80px}
.cheer{font-family:var(--display);font-style:italic;font-size:17px;color:var(--rose);line-height:1.35}
.timer{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0 4px;text-align:center}
.ring{position:relative;width:170px;height:170px}
.ring svg{position:absolute;inset:0}
.ring .clock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .clock b{font-family:var(--display);font-weight:300;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.ring .clock span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.field{display:flex;flex-direction:column;gap:5px}
.field .lbl,.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
input[type=number],input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:8px 10px}
textarea{width:100%;min-height:66px;resize:vertical}
.btn{border:1px solid var(--ink);border-radius:2px;padding:12px 18px;font-weight:600;background:var(--ink);color:var(--on-ink);letter-spacing:.02em}
.btn:hover{background:var(--rose);border-color:var(--rose)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--cream-2);border-color:var(--ink)}
.btn.danger{background:var(--rose);border-color:var(--rose);color:var(--on-ink)}
.btn.full{width:100%}
.btn.sm{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{background:var(--ink);border-color:var(--ink)}
.linkbtn{border:0;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px;padding:4px}
.walk{border:1px solid var(--line);background:var(--butter-soft);display:flex;gap:14px;align-items:center;padding:13px 16px;width:100%;text-align:left;color:var(--ink);font:inherit}
.walk .check{width:22px;height:22px;font-size:12px}
.walk.done .check{background:var(--ink);color:var(--on-ink)}
.walk.done .big,.walk.done .grow{opacity:.55}
.walk .big{font-family:var(--display);font-size:28px;font-weight:300;line-height:1;min-width:52px}
.walk .big small{font-family:var(--body);font-size:12px;color:var(--muted)}
.walk .grow{flex:1}
.walk-top{display:flex;gap:16px;align-items:center;padding:13px 16px}
.walk-top .big{font-family:var(--display);font-size:28px;font-weight:300;line-height:1;min-width:52px}
.walk-top .big small{font-family:var(--body);font-size:12px;color:var(--muted)}
.walk-top .grow{flex:1}
.walk .flow{border-top:1px dashed var(--hair)}
.finish{display:flex;flex-direction:column;gap:10px}
.toast{border:1px solid var(--line);background:var(--cafe-soft);padding:16px;display:flex;flex-direction:column;gap:8px}
.toast .cheer{font-size:20px;color:var(--ink)}
.toast ul{margin:0;padding-left:18px}

<script>
/* ---------- program library: Lifetime Plymouth machines + floor core ---------- */
const DB_SIZES = [3,5,8,10,12,15,17.5,20,25,30,35,40];
const LIB = {
  legpress:{name:"Leg Press",step:10,start:70,cue:"Feet shoulder-width, middle of the platform. Lower until knees reach about 90°, press through your heels. Don't lock your knees."},
  legcurl:{name:"Seated Leg Curl",step:5,start:35,cue:"Pad just above the heels, thigh pad snug. Curl down for 1 count, return slowly for 3."},
  kickback:{name:"Glute Kickback Machine",step:5,start:40,perSide:true,cue:"Hips square, slight bend in the standing knee. Press back through the heel, squeeze at the top, don't arch your low back. Log reps per leg."},
  legext:{name:"Leg Extension",step:5,start:40,cue:"Knee lined up with the machine pivot. Lift to straight, pause, lower slowly."},
  abductor:{name:"Hip Abductor (outer thigh)",step:10,start:50,cue:"Sit tall or lean slightly forward for more glute. Press out, control the return."},
  adductor:{name:"Hip Adductor (inner thigh)",step:10,start:50,cue:"Start in a comfortable stretch. Squeeze in, pause, open slowly."},
  row:{name:"Seated Row",step:5,start:40,cue:"Chest on the pad. Pull elbows back past your ribs, squeeze shoulder blades."},
  chestpress:{name:"Seated Chest Press",step:5,start:30,cue:"Handles at mid-chest height. Press out without locking elbows, 3 counts back."},
  pulldown:{name:"Lat Pulldown",step:5,start:45,cue:"Slight lean back, pull the bar to your upper chest, elbows down toward your back pockets."},
  shoulder:{name:"Shoulder Press",step:5,start:20,cue:"Handles at shoulder height. Press up without shrugging, lower with control."},
  revfly:{name:"Rear Delt Fly (Pec Fly machine)",step:5,start:25,cue:"Face the pad, arms long. Open wide, pause, return slowly."},
  biceps:{name:"Biceps Curl Machine",step:5,start:20,cue:"Upper arms flat on the pad. Curl up, lower for 3 counts."},
  triceps:{name:"Triceps Extension / Dip Machine",step:5,start:30,cue:"Elbows tucked. Press down to straight, control the return."},
  dbcrunch:{name:"Weighted Crunch",db:true,start:10,cue:"On a mat, knees bent, dumbbell held on your chest. Curl your ribs toward your hips, lower slowly."},
  deadbug:{name:"Dead Bug with Dumbbell",db:true,start:8,perSide:true,cue:"Hold one dumbbell over your chest with both hands. Low back pressed into the mat, extend opposite leg slowly. Log reps per side."},
  twist:{name:"Russian Twist with Dumbbell",db:true,start:10,perSide:true,cue:"Lean back slightly, chest tall. Rotate from your ribs, not your arms. Log reps per side."},
  revcrunch:{name:"Reverse Crunch",bw:true,cue:"On a mat, knees bent over hips. Curl your hips up off the floor, lower for 3 counts."},
  plank:{name:"Forearm Plank",bw:true,timed:true,cue:"Elbows under shoulders, squeeze glutes, breathe. Stop when your hips start to sag."},
  sideplank:{name:"Side Plank",bw:true,timed:true,perSide:true,cue:"Elbow under shoulder, hips stacked and lifted. Knees down for an easier version. Log seconds per side."}
};
const ORDER = {
  lower:{fixed:["legpress","legcurl"],rotate:["kickback","legext","abductor","adductor"]},
  upper:{fixed:["row","chestpress"],rotate:["pulldown","shoulder","revfly","biceps","triceps"]},
  light:{fixed:["legpress","row"],rotate:["chestpress","legcurl","pulldown","kickback","shoulder"]},
  core:["dbcrunch","plank","deadbug","twist","sideplank","revcrunch"]
};
const range = id=>LIB[id].timed?{lo:30,hi:60,inc:5,start:30}:LIB[id].bw?{lo:12,hi:20,inc:2,start:12}:{lo:8,hi:12,inc:2,start:10};
const ENERGY = [
  {v:1,label:"Drained",mult:.85,rest:60,effort:"5/10",sets:2,note:"Rough day. About 15% lighter, two sets, slow and smooth. Showing up is the win."},
  {v:2,label:"Tired",mult:.92,rest:60,effort:"6/10",sets:3,note:"A little lighter than usual. Keep every rep smooth and leave a few in the tank."},
  {v:3,label:"Okay",mult:1,rest:75,effort:"7/10",sets:3,note:"Normal day at your working weights. The last 2 reps of each set should feel like work."},
  {v:4,label:"Good",mult:1,rest:90,effort:"8/10",sets:3,note:"Good energy. Working weights, and take the last set close to hard."},
  {v:5,label:"Energized",mult:1.05,rest:90,effort:"8–9/10",sets:3,note:"Great day to push. Weights nudged up about 5% and an extra set on your first machine."}
];
const LIGHT = {mult:.8,rest:60,effort:"6/10",sets:2};

/* ---------- the program: 6-week blocks, three sessions per training week ----------
   A sequence, not a calendar. A missed day waits for you. Main lifts are ORDER[type].fixed. */
const WEEK_DAYS = ["lower","upper","recovery"];
const BLOCK = [
  {phase:"Foundation", main:{lo:10,hi:12}, acc:{lo:10,hi:12}, sets:3, mainSets:3, rest:75, effort:"7/10",
   cue:"Smooth, controlled reps with about 3 left in the tank. We're setting clean baselines."},
  {phase:"Foundation", main:{lo:10,hi:12}, acc:{lo:10,hi:12}, sets:3, mainSets:3, rest:75, effort:"7/10",
   cue:"Same rep range as last week. Beat last week by a rep or a little weight."},
  {phase:"Build", main:{lo:8,hi:10}, acc:{lo:8,hi:10}, sets:3, mainSets:3, rest:90, effort:"8/10",
   cue:"Heavier weights, fewer reps. The last two reps of each set should take real effort."},
  {phase:"Build", main:{lo:8,hi:10}, acc:{lo:8,hi:10}, sets:3, mainSets:4, rest:90, effort:"8/10",
   cue:"A fourth set on your two main lifts this week. More work at the same weights."},
  {phase:"Strength", main:{lo:6,hi:8}, acc:{lo:8,hi:10}, sets:3, mainSets:4, rest:120, effort:"8–9/10",
   cue:"The heaviest week of the block. Full two-minute rests, and perfect form on every rep."},
  {phase:"Deload", main:{lo:10,hi:12}, acc:{lo:10,hi:12}, sets:2, mainSets:2, rest:60, effort:"6/10", deload:true,
   cue:"An easy week at about 80%. Your body turns the last five weeks into strength now. Next week, a new block starts."}
];
const slotInfo = i=>{ const wk = Math.floor(i/3)%BLOCK.length; return {slot:i, block:Math.floor(i/(3*BLOCK.length))+1, week:wk+1, day:i%3, type:WEEK_DAYS[i%3], ph:BLOCK[wk]}; };
const CORE_REST = 45;
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const STRETCHES = [
  ["Hip flexor lunge stretch","45 sec each side"],["Figure-4 glute stretch","45 sec each side"],
  ["Doorway chest stretch","30 sec × 2"],["Cat–cow","10 slow rounds"],
  ["Child's pose","60 sec"],["Hamstring stretch on a bench","45 sec each side"],
  ["Foam roll quads and upper back","2 min"],["Lat stretch on a rack","30 sec × 2 each side"]
];
const TYPE_NAME = {lower:"Legs & glutes",upper:"Chest, back & arms",light:"Light full body",recovery:"Recovery",mix:"Surprise mix"};
const GRADE = {easy:"Easy",right:"Just right",hard:"Hard"};

/* ---------- encouragement ---------- */
const AFFIRM = [
  "You showed up. That's the hardest rep of the day.",
  "Strength is a long game, and you're playing it well.",
  "Every set today is a gift to your future self.",
  "Tired still counts. Lighter weight still builds you.",
  "Consistency beats intensity, and you're proving it.",
  "You take care of everyone else. This time is yours.",
  "Twenty minutes is a real workout. Make it count.",
  "Small steps, steady climb. That's how strong women are made.",
  "Progress is quiet until one day it isn't.",
  "Your body can do more than your workday suggests.",
  "Longevity is built in ordinary weeks like this one.",
  "You don't have to feel motivated. You just have to start.",
  "Strong bones, strong heart, strong mind. You're building all three.",
  "The version of you at 70 is cheering right now.",
  "Discipline is just self-respect on a schedule.",
  "You're allowed to be proud of this.",
  "Muscle is medicine. You're filling the prescription.",
  "Show up, do the reps, go home. That's the whole secret.",
  "You're stronger than you were last month. The numbers say so.",
  "One good set at a time."
];
const SET_CHEERS = ["Strong set.","Beautiful control.","That's the one.","Smooth and steady.","Right on target.","You made that look easy.","Keep that rhythm going.","Look at you go.","Clean reps. Love that.","That's how it's done.","Steady hands, strong body.","You're in the zone."];
const HARD_CHEERS = ["Hard is where strength gets made.","That one took grit. Good.","Tough set, and you finished it.","That's what a real last set feels like."];
const REST_LINES = ["Breathe low and slow. Shoulders down.","Sip some water. You've earned it.","Shake it out. Next set is yours.","Relax your jaw. Let your heart rate settle.","Think about your form cue for the next set.","Roll your shoulders back. Stand tall.","You're doing exactly what you came here to do.","Deep breath in… and let it go.","Your muscles are recovering right now. Let them.","Next set, same quality. You've got it."];
const WALK_LINES = ["Easy pace. Let the workday fall off your shoulders.","Swing your arms. Wake everything up.","Tall posture, relaxed shoulders.","This is you choosing yourself today.","Warm muscles lift better. You're setting up a good session.","Breathe in through your nose. Settle in.","Nothing to prove on the treadmill. Just warm up."];
const DONE_LINES = ["Done, and done well.","Another one in the books.","That machine didn't stand a chance.","Proud of that one.","Checked off. On to the next.","Beautiful work."];
let affirmIdx = Math.floor(Math.random()*AFFIRM.length);
const rnd = arr=>arr[Math.floor(Math.random()*arr.length)];

/* ---------- state ---------- */
const DEFAULT_STATE = {manual:{}};
let state = structuredClone(DEFAULT_STATE);
let sessions = [];
let ui = {tab:"today", energy:3, minutes:20, walk:true, focus:"auto", open:null, saved:null, chartEx:null, rest:null, walkT:null, cheer:null, editSet:null, histOpen:null, confirmDel:null, importPreview:null, dataMsg:null, exportText:null};
let draft = null;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffled(arr, rng){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
try{ const u = JSON.parse(localStorage.getItem("coach.ui")||"null"); if(u) Object.assign(ui,{energy:u.energy||3,minutes:u.minutes||20,walk:u.walk!==false}); }catch(e){}
try{ const d = JSON.parse(localStorage.getItem("coach.draft")||"null"); if(d && d.v===3) draft=d; }catch(e){}
try{ const l = JSON.parse(localStorage.getItem("coach.live")||"null"); if(l && l.on && l.date===dkeyNow()) ui.live = true; }catch(e){}
try{ const m = JSON.parse(localStorage.getItem("coach.mix")||"null"); if(m && m.date===dkeyNow()){ ui.mixSeed=m.seed; if(m.on) ui.focus="mix"; } }catch(e){}
function dkeyNow(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function newMix(){ ui.mixSeed = Math.floor(Math.random()*1e9); try{ localStorage.setItem("coach.mix", JSON.stringify({date:dkeyNow(), seed:ui.mixSeed, on:true})); }catch(e){} }

/* ---------- storage: artifact db, falls back to this browser ---------- */
/* All data lives in this browser's localStorage. On iPhone, the home-screen app has its own
   storage, separate from Safari, so backups move data in and out via Export / Import. */
const store = {
  mode:"pending",
  init(){
    try{ const s = JSON.parse(localStorage.getItem("coach.state")||"null"); if(s) state = Object.assign(structuredClone(DEFAULT_STATE), s); }catch(e){}
    if(!state.manual) state.manual = {};
    try{ sessions = JSON.parse(localStorage.getItem("coach.sessions")||"[]").sort(bySessionDesc); }catch(e){}
    try{
      const r = JSON.parse(localStorage.getItem("coach.reopened")||"null");

/* ======================================================================
   PROGRESSION — replayed from your full history every time, so editing,
   deleting or importing a workout always gives the right numbers.
   It looks at all your sets together:
   • Your "proven" weight is the heaviest weight where you hit your reps
     without it being hard — or hard only on the final set (that's just right).
   • A one-off heavier set that felt hard means "meet in the middle" next time.
   • Proven for all your sets → +2 reps. At 12 reps → add weight, back to 8.
   • All easy → add weight now. Tired and light days never lower your numbers.
   ====================================================================== */
function evaluate(ex, cur, s){
  const id = ex.id, L = LIB[id]; if(!L) return cur;
  const rg = ex.range ? Object.assign({start:ex.range.lo, inc:2}, ex.range) : range(id);
  const sameRange = !cur.rg || (cur.rg.lo===rg.lo && cur.rg.hi===rg.hi);
  const sets = (ex.sets||[]).map(x=>({w:Number(x.w)||0, reps:Number(x.reps)||0, grade:x.grade||"right"}));
  if(!sets.length) return cur;
  const T = (ex.target && ex.target.reps) || cur.reps || rg.start;
  const planned = ex.planned || sets.length;
  const full = s.type!=="light" && (s.energy||3)>=3;
  const curW = cur.w||0, curR = cur.reps||rg.start;
  const last = {date:s.date, sets, change:"hold"};
  let nextW = curW, nextR = T, change = "hold", proven = null, pushed = null;
  const lastIdx = sets.length-1;

  if(L.bw){
    const hit = sets.length>=planned && sets.every(x=>x.reps>=T);
    const hardEarly = sets.some((x,i)=>x.grade==="hard" && i!==lastIdx);
    if(hit && !hardEarly){ nextR = Math.min(rg.hi, T + (sets.every(x=>x.grade==="easy")?2*rg.inc:rg.inc)); change = nextR>T?"reps":"hold"; }
    else if(sets.filter(x=>x.grade==="hard"||x.reps<T-rg.inc).length>=2){ nextR = Math.max(rg.lo, T-rg.inc); change="down"; }
    if(!full && nextR<curR){ nextR=curR; change="hold"; }
    Object.assign(last,{change, reps:sets.map(x=>x.reps)});
    return Object.assign({}, cur, {reps:nextR, last});
  }

  const weights = [...new Set(sets.map(x=>x.w))].sort((a,b)=>b-a);
  for(const w of weights){
    const idx = sets.map((x,i)=>x.w===w?i:-1).filter(i=>i>=0);
    const hit = idx.every(i=>sets[i].reps>=T);
    const hard = idx.filter(i=>sets[i].grade==="hard");
    const okHard = hard.length===0 || (hard.length===1 && hard[0]===lastIdx && idx.length>1);
    if(hit && okHard){ proven = w; break; }
    if(pushed===null) pushed = w;
  }
  if(proven===null){
    const base = (ex.target && ex.target.w) || curW || Math.min(...weights);
    const bad = sets.filter(x=>x.grade==="hard" || x.reps<T-2).length;
    if(bad>=2){ nextW = stepDown(id, base); change="down"; } else { nextW = base; change="hold"; }
    nextR = T;
  } else {
    const atP = sets.filter(x=>x.w===proven);
    const volumeOK = sets.filter(x=>x.w>=proven).length >= planned;
    if(pushed!==null && pushed>proven){
      const mid = stepUp(id, proven);
      if(mid < pushed){ nextW = mid; nextR = T; change="between"; last.pushed = pushed; }
      else if(T<rg.hi){ nextW = proven; nextR = Math.min(rg.hi, T+rg.inc); change="reps"; }
      else { nextW = proven; nextR = T; change="hold"; }
    } else if(volumeOK && atP.every(x=>x.grade==="easy")){ nextW = stepUp(id, proven); nextR = T; change="weight"; last.easy = true; }
    else if(volumeOK){
      if(T>=rg.hi){ nextW = stepUp(id, proven); nextR = rg.lo; change="weight"; }
      else { nextW = proven; nextR = Math.min(rg.hi, T+rg.inc); change="reps"; }
    } else { nextW = proven; nextR = T; change="hold"; }
  }
  if(!full && sameRange && curW && nextW<curW){ nextW = curW; nextR = curR; change="hold"; last.lightDay = true; }
  Object.assign(last,{change, w:Math.max(...weights), proven, reps:sets.map(x=>x.reps)});
  return Object.assign({}, cur, {w:nextW, reps:nextR, last, rg:{lo:rg.lo, hi:rg.hi}});
}
function computeAll(list){
  const W = {}, H = {};
  const ev = [];
  for(const [id,m] of Object.entries(state.manual||{})) if(LIB[id]) ev.push({t:m.at||"0", m, id});
  for(const s of (list||sessions)) ev.push({t:s.createdAt||s.date, s});
  ev.sort((a,b)=>String(a.t).localeCompare(String(b.t)));
  for(const e of ev){
    if(e.m){ const c = W[e.id]||{}; W[e.id] = Object.assign({}, c, e.m.w?{w:e.m.w}:{}, e.m.reps?{reps:e.m.reps}:{}); continue; }
    if(e.s.deload) continue;
    for(const ex of (e.s.exercises||[])){
      if(!LIB[ex.id] || !(ex.sets||[]).length) continue;
      W[ex.id] = evaluate(ex, W[ex.id]||{}, e.s);
      const l = W[ex.id].last;
      if(!LIB[ex.id].bw){ (H[ex.id]=H[ex.id]||[]).push({date:e.s.date, w:l.proven||l.w}); }
    }
  }
  return {W, H};
}

const STEM_LINES = ["The first stem. A good start.","Two in. One more completes the week.","Three for three. Beautifully done."];
function weekKeyOf(date){ return dkey(weekStart(parseKey(date))); }
function computeWeeks(list){
  const map = {};
  for(const s of [...list].sort((a,b)=>String(a.createdAt||a.date).localeCompare(String(b.createdAt||b.date)))){
    const k = weekKeyOf(s.date);
    const w = map[k] || (map[k] = {key:k, dates:[], mood:moodFor(k)});
    if(!w.dates.includes(s.date)) w.dates.push(s.date);
  }
  const curKey = dkey(weekStart(today));
  if(!map[curKey]) map[curKey] = {key:curKey, dates:[], mood:moodFor(curKey)};
  const weeks = Object.values(map).sort((a,b)=>a.key<b.key?-1:1);
  weeks.forEach(w=>{ w.n = Math.min(3, w.dates.length); w.complete = w.n>=3; w.stems = MOODS[w.mood][1].slice(0,w.n); });
  const runs = []; let run = 0, best = 0;
  if(weeks.length){
    for(let t = parseKey(weeks[0].key); dkey(t) <= curKey; t = new Date(t.getTime()+7*864e5)){
      const k = dkey(t), w = map[k];
      if(w && w.complete){ run++; best = Math.max(best, run); runs.push({week:w, run}); }
      else if(k!==curKey) run = 0;
    }

function computeDistinctions(list){
  const ev = []; const add = (type, name, date, text)=>ev.push({type, name, date, text, week:weekKeyOf(date)});
  const once = new Set(); const addOnce = (type,name,date,text)=>{ if(once.has(type)) return; once.add(type); add(type,name,date,text); };
  const st = {visits:0, walk:0, gym:0, volume:0, plank:0, recov:0, grit:0, every:0};
  const best = {}, provenBest = {}, tried = new Set(), movedUp = new Set(), lastSets = {};
  const W = {}; const reached = {};
  const cross = (L, val, date)=>{ for(const r of L.rungs){ const k = L.id+":"+r; if(!reached[k] && val>=r){ reached[k]=1; add("ladder:"+L.id, L.name(r), date, L.machine?`${L.label}, ${r} lb, handled well`:`${L.fmt(val)} ${L.unit}`); } } };
  const events = [];
  for(const [id,m] of Object.entries(state.manual||{})) if(LIB[id]) events.push({t:m.at||"0", m, id});

  for(const e of events){
    if(e.m){ const c=W[e.id]||{}; W[e.id]=Object.assign({},c,e.m.w?{w:e.m.w}:{},e.m.reps?{reps:e.m.reps}:{}); continue; }

    st.visits++; st.gym += s.minutes||0; st.walk += s.walk||0;
    if(!first){ first = d; addOnce("first","First Stem",d,"Your first workout in the coach"); }
    const hr = s.createdAt ? new Date(s.createdAt).getHours() : 12;
    if(hr<7) addOnce("early","Early Riser",d,"A workout finished before 7 a.m.");
    if(hr>=20) addOnce("late","After Hours",d,"A workout finished after 8 p.m.");
    if(s.type==="recovery"){ st.recov++; if(st.recov===4) add("rest","Rest Is Best",d,"Four recovery days logged"); }
    if(s.type==="light") addOnce("light","Bonus Round",d,"Your first light full-body day");
    if(s.type!=="recovery" && s.minutes===40) addOnce("forty","The Full Forty",d,"A full 40-minute session");
    if(s.type!=="recovery" && s.minutes===10) addOnce("ten","Ten Well Spent",d,"Made a 10-minute window count");
    if(s.energy===1 && s.type!=="recovery") add("showed","Showed Up Anyway",d,`${TYPE_NAME[s.type]||"Workout"} on a Drained day`);
    if(s.energy<=2 && s.type!=="recovery"){ st.grit++; if(st.grit===5) add("grit","Tired, Still Came",d,"Five workouts on tired days"); }
    if(exs.length && s.type!=="recovery" && exs.every(x=>x.sets.length>=(x.planned||x.sets.length) && x.sets.every(y=>Number(y.reps)>=((x.target&&x.target.reps)||0)))){

    for(const x of exs){
      const L = LIB[x.id]; tried.add(x.id);
      const prevW = (W[x.id]&&W[x.id].w) || (x.target&&x.target.w) || 0;
      W[x.id] = evaluate(x, W[x.id]||{}, s);
      const prev = lastSets[x.id];
      if(prev && x.sets.length>=prev.length && x.sets.every((y,i)=>!prev[i] || Number(y.w)>Number(prev[i].w) || (Number(y.w)===Number(prev[i].w) && Number(y.reps)>Number(prev[i].reps))))

    if(sessVol>=5000) addOnce("heavy","Heavy Lifting",d,`${Math.round(sessVol).toLocaleString()} lb lifted in one session`);
    if(tried.size>=Object.keys(LIB).filter(k=>!LIB[k].bw && !LIB[k].db).length) addOnce("rounded","Well Rounded",d,"You've used every machine in your plan");
    const days = first ? Math.round((parseKey(d)-parseKey(first))/864e5) : 0;
    if(days>=90) addOnce("q","Three Months In",d,"Still here, three months later");

    for(const L of LADDERS){

    const d = [...r.week.dates].sort().pop();
    if(firstWeek){ add("week","Three for Three",d,"Your first complete arrangement"); firstWeek=false; }
    for(const n of wL.rungs) if(r.run===n && !reached["weeks:"+n]){ reached["weeks:"+n]=1; add("ladder:weeks", wL.name(n), d, `${n} complete weeks in a row`); }

  const goals = [];
  for(const L of LADDERS){
    const val = L.machine ? Math.max(provenBest[L.machine]||0, (DER.W[L.machine]&&DER.W[L.machine].w)||0) : L.id==="weeks" ? wk.run : L.id==="plank" ? st.plank : st[L.id];

}

/* ======================================================================
   THE COACH — works out where you are in the program and what today is.
   • Programmed sessions carry s.slot. The next session is the first open
     slot in the current training week, so a missed day just waits.
   • Picking a different focus: if it's another open session this week,
     it's a swap (the skipped one moves to next visit). Otherwise it's a
     bonus day: logged and counted, but the program stays where it was.
   ====================================================================== */
function programState(){
  const done = new Set(sessions.filter(s=>Number.isInteger(s.slot)).map(s=>s.slot));
  const max = done.size ? Math.max(...done) : -1;
  let wk = max<0 ? 0 : Math.floor(max/3);
  if([0,1,2].every(d=>done.has(wk*3+d))) wk++;
  const open = [0,1,2].map(d=>wk*3+d).filter(i=>!done.has(i));
  return {done, wk, open, next:slotInfo(open[0])};
}
function coachToday(){
  const P = programState(), next = P.next;
  const R = draft && draft.reopen && draft.reopen.date===TODAY ? draft.reopen : null;
  if(R){
    const info = Number.isInteger(R.slot) ? Object.assign({}, slotInfo(R.slot), {type:R.type}) : Object.assign({}, slotInfo(P.open[0]), {type:R.type, slot:null});
    return {P, next, info, mode:R.bonus?"bonus":"plan", adjust:"", mult:1, notes:[], trainedToday:false, reopen:R};
  }
  const trainedToday = sessions.some(s=>s.date===TODAY);
  const pick = ui.focus==="auto" ? next.type : ui.focus;
  let mode = "plan", info = next, adjust = "";
  if(pick!==next.type){
    const swapSlot = P.open.map(slotInfo).find(x=>x.type===pick || (pick==="light" && x.type==="recovery" && x.slot===P.open[0]));
    if(swapSlot && pick!=="mix"){
      mode = "swap"; info = Object.assign({}, swapSlot, {type:pick});
      adjust = pick==="recovery" ? `Taking this week's recovery session now. ${TYPE_NAME[next.type]} is still next.`
        : pick==="light" ? `A light full-body day as this week's third session. It keeps your numbers where they are.`
        : `Swapped. This counts as this week's ${TYPE_NAME[pick].toLowerCase()} session, and ${TYPE_NAME[next.type].toLowerCase()} moves to your next visit.`;
    } else {
      mode = "bonus"; info = Object.assign({}, slotInfo(P.open[0]), {type:pick, slot:null});
      adjust = pick==="mix" ? `A fun day, just for you. Your program picks up with ${TYPE_NAME[next.type].toLowerCase()} next time.`
        : `A bonus day. It's logged and your weights still count, but your program picks up with ${TYPE_NAME[next.type].toLowerCase()} next time.`;
    }
  }
  // a coach's adjustments
  const notes = [];
  let mult = 1;
  const prev = sessions.find(s=>s.date<TODAY);
  const gap = prev ? Math.round((parseKey(TODAY)-parseKey(prev.date))/864e5) : 0;
  if(gap>=10 && info.type!=="recovery"){ mult *= .9; notes.push(`It's been ${gap} days, so we ease back in at about 90% today.`); }
  const recent = sessions.find(s=>s.date<TODAY && (parseKey(TODAY)-parseKey(s.date))/864e5<=1 && (s.type===info.type || (["mix","light"].includes(s.type) && ["lower","upper"].includes(info.type))));
  if(recent && ["lower","upper"].includes(info.type)){ mult *= .95; notes.push(`You trained ${TYPE_NAME[recent.type].toLowerCase()} yesterday, so today runs a touch lighter.`); }
  return {P, next, info, mode, adjust, mult, notes, trainedToday};
}
function autoFocus(){ return programState().next.type; }
function progFields(C){
  if(C.reopen){ const R = C.reopen, f = {}; for(const k of ["slot","bonus","block","week","phase","deload"]) if(R[k]!==undefined) f[k]=R[k]; return f; }
  const i = C.info, f = {block:i.block, week:i.week, phase:i.ph.phase};
  if(C.mode==="bonus") f.bonus = true; else f.slot = i.slot;
  if(i.ph.deload && C.mode!=="bonus") f.deload = true;

/* Rep range for an exercise today: the phase's main or accessory range; core keeps its own. */
function repRange(id, e){
  if(LIB[id].bw || LIB[id].db || !e || !e.ph) return range(id);
  const r = (e.mainIds||[]).includes(id) ? e.ph.main : e.ph.acc;
  return {lo:r.lo, hi:r.hi, inc:2, start:r.lo};
}
function prescribe(id, e){
  const ex = LIB[id], rg = repRange(id, e), st = DER.W[id] || {};
  if(ex.bw) return {w:0, reps:st.reps || rg.start, bw:true, tag:"", msg:lastMsg(id, st)};
  if(!st.w) return {w:roundFor(id, ex.start*Math.min(1,e.mult)), reps:rg.start, tag:"First try", cls:"new", fresh:true, msg:null};
  // a new rep range converts your working weight through estimated strength (Epley)
  let base = st.w, reps = st.reps || rg.start, converted = false;
  const fits = reps>=rg.lo && reps<=rg.hi;
  if(!fits || (st.rg && (st.rg.lo!==rg.lo || st.rg.hi!==rg.hi))){
    const e1 = st.w*(1+(st.reps||10)/30);
    base = roundFor(id, e1/(1+rg.lo/30)); reps = rg.lo; converted = base!==st.w || !fits;
  }

  const ch = st.last && st.last.change;
  const tag = converted ? (w>st.w ? "heavier phase" : "new phase") : w>base ? "+ energy" : w<base ? "eased" : ch==="weight"||ch==="between" ? "new weight" : ch==="reps" ? "more reps" : "";

function lastMsg(id, st, todayW){
  const L = st.last, u = unitOf(id), rw = repWord(id);

  if(!L) return null;
  const base = {date:L.date, sets:L.sets};
  if(LIB[id].bw) return Object.assign(base, L.change==="reps" ? {read:"Every set done.", plan:`Aim for ${R} ${rw} each set today.`} : {read:"Good work.", plan:`Own ${R} ${rw} every set today.`});
  if(L.change==="between") return Object.assign(base, {read:`${L.proven} ${u} felt good. ${L.pushed} ${u} was a stretch.`, plan:`Meet in the middle at ${W} ${u} today.`});

  if(L.change==="reps") return Object.assign(base, {read:`Every goal met at ${L.proven} ${u}.`, plan:`Same weight, aim for ${R} reps each set.`});
  if(L.change==="down") return Object.assign(base, {read:"That one was tough.", plan:`${W} ${u} today, building back with great form.`});

/* ---------- plan builder ---------- */
function walkFor(min, v){
  const m = {10:4,20:5,30:8,40:10}[min];
  const pace = v<=2 ? {speed:"2.8–3.0 mph",incline:"2–4%"} : v===3 ? {speed:"3.0–3.2 mph",incline:"5–6%"} : {speed:"3.2–3.5 mph",incline:"8–10%"};
  return {min:m,...pace};
}
function buildPlan(){
  const base = energyOf(ui.energy);
  const C = coachToday(), type = C.info.type, ph = C.info.ph;
  if(type==="recovery"){
    const n = Math.max(3, Math.min(STRETCHES.length, Math.round(ui.minutes/4)));
    return {type,C,e:base,walk:{min:Math.max(5, ui.minutes - n*2),speed:"2.8–3.0 mph",incline:"0–3%"},stretches:STRETCHES.slice(0,n),items:[],abs:[],all:[],est:ui.minutes};
  }
  const mainIds = (ORDER[type]||{}).fixed || [];
  const e = type==="light" ? Object.assign({}, base, LIGHT, {label:"Light day", v:base.v, ph, mainIds, mainSets:2, mult:LIGHT.mult*C.mult, note:"About 80% of your working weights, 2 easy sets each. It won't lower your numbers."})

        effort: base.v<=2 || ph.deload ? (ph.deload ? ph.effort : base.effort) : ph.effort});
  const walk = ui.walk ? walkFor(ui.minutes, e.v) : null;
  const budget = ui.minutes - (walk?walk.min:0);
  const baseSets = ui.minutes===10 ? 2 : e.sets;
  const mainSets = ui.minutes===10 ? 2 : (e.mainSets||e.sets);
  const cost = (sets,rest=e.rest)=>sets*0.5+(sets-1)*rest/60+0.75;
  let candidates, corePool = null;
  if(type==="mix"){
    const rng = mulberry32(ui.mixSeed||1);
    const lo = shuffled([...ORDER.lower.fixed, ...ORDER.lower.rotate], rng), up = shuffled([...ORDER.upper.fixed, ...ORDER.upper.rotate], rng);
    const first = rng()<.5 ? [lo,up] : [up,lo];
    candidates = []; for(let i=0;i<Math.max(lo.length,up.length);i++){ if(first[0][i]) candidates.push(first[0][i]); if(first[1][i]) candidates.push(first[1][i]); }
    corePool = shuffled(ORDER.core, rng);
  } else {
    const ord = ORDER[type];
    const nType = sessions.filter(s=>s.type===type && s.date!==TODAY).length;
    let rot = ord.rotate.map((_,i)=>ord.rotate[(i+nType)%ord.rotate.length]);
    // didn't like the last one? lead with different accessory machines this time
    const lastSame = sessions.find(x=>x.type===type && x.date!==TODAY && !x.bonus);
    if(lastSame && lastSame.rating && lastSame.rating<=2){
      const skip = new Set((lastSame.exercises||[]).map(x=>x.id));
      rot = [...rot.filter(id=>!skip.has(id)), ...rot.filter(id=>skip.has(id))];
      C.notes.push(`You didn't love your last ${TYPE_NAME[type].toLowerCase()} session, so the coach swapped in different machines.`);
    }
    candidates = [...ord.fixed, ...rot];
  }
  const absSets = 2, absCost = cost(absSets,CORE_REST);
  const wantAbs = ui.minutes>=20;
  const reserve = wantAbs ? absCost : 0;
  const items = []; let used = 0;
  for(const id of candidates){
    let sets = mainIds.includes(id) ? mainSets : baseSets;
    if(type!=="light" && e.v===5 && items.length===0 && ui.minutes>=30 && !ph.deload) sets += 1;
    const c = cost(sets);
    if(used + c + reserve > budget + 0.5 && items.length>0) break;
    items.push({id,sets,rest:e.rest}); used += c;
  }
  const abs = [];
  if(wantAbs){
    const nCore = sessions.filter(s=>s.type!=="recovery" && s.date!==TODAY).length*2;
    const nAbs = (budget-used) >= absCost*2 ? 2 : 1;
    for(let i=0;i<nAbs;i++){ abs.push({id:corePool?corePool[i]:ORDER.core[(nCore+i)%ORDER.core.length],sets:absSets,rest:CORE_REST}); used += absCost; }
  }
  return {type,C,e,walk,items,abs,all:[...items,...abs],est:Math.round(used+(walk?walk.min:0))};
}

/* ---------- draft (the workout in progress) ---------- */
function ensureDraft(plan){
  const key = TODAY+"|"+plan.type+(plan.type==="mix"?"|"+ui.mixSeed:"");
  if(!draft || (draft.key!==key && !(draft.reopen && draft.reopen.date===TODAY))) draft = {v:3, key, entries:{}, note:""};
  for(const it of plan.all){
    const rx = prescribe(it.id, plan.e);
    let d = draft.entries[it.id];
    if(!d){ draft.entries[it.id] = {target:{w:rx.w,reps:rx.reps}, planned:it.sets, sets:[], inW:rx.w, inReps:rx.reps, note:"", done:false, touched:false}; continue; }
    d.planned = it.sets;
    // only refresh the suggestion before you start and if you haven't changed the numbers yourself
    if(!d.sets.length && !d.touched && (d.target.w!==rx.w || d.target.reps!==rx.reps)){ d.target={w:rx.w,reps:rx.reps}; d.inW=rx.w; d.inReps=rx.reps; }
  }
}

let audioCtx = null, wakeLock = null, tickH = null;
function unlockAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
function chime(){
  try{
    unlockAudio();
    [0,0.22,0.44].forEach(t=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type="sine"; o.frequency.value=t>0.4?1175:880; g.gain.setValueAtTime(0.0001,audioCtx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.3,audioCtx.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+t+0.35); o.connect(g).connect(audioCtx.destination); o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+0.4); });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}
async function keepAwake(){ try{ if(!wakeLock && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>{wakeLock=null;}); } }catch(e){} }
function ensureTick(){ if(!tickH) tickH = setInterval(tick, 250); }
function leftOf(t){ return t.paused ? t.left : Math.max(0, Math.ceil((t.endsAt-Date.now())/1000)); }
function tick(){
  let active = false;
  const r = ui.rest;
  if(r && !r.done){
    active = true;
    const left = leftOf(r);
    setText("rest-clock", fmtClock(left)); setArc("rest-arc", left/r.total);
    if(Date.now()-r.lineAt>12000){ r.lineAt=Date.now(); r.line=rnd(REST_LINES); setText("rest-line", r.line); }
    if(left===0){ r.done=true; chime(); render(); }
  }
  const w = ui.walkT;
  if(w && !w.done){
    active = true;
    const left = leftOf(w);
    setText("walk-clock", fmtClock(left)); setArc("walk-arc", left/w.total);
    if(!w.paused && Date.now()-w.lineAt>20000){ w.lineAt=Date.now(); w.line=rnd(WALK_LINES); setText("walk-line", w.line); }
    if(left===0 && !w.paused){ w.done=true; chime(); render(); }
  }
  if(!active){ clearInterval(tickH); tickH=null; }
}

/* Week strip: one page per Monday–Sunday week, swipeable. Opens on this week; goes back to the

const WEEKS_AHEAD = 4;
let weekHtml = "", weekPages = [];
function weekPagesFrom(){
  const cur = weekStart(today);
  const first = sessions.length ? weekStart(parseKey(sessions[sessions.length-1].date)) : cur;
  const back = Math.min(104, Math.max(8, Math.round((cur-first)/(7*864e5))));
  const out = [];
  for(let w=-back; w<=WEEKS_AHEAD; w++){ const d=new Date(cur); d.setDate(cur.getDate()+7*w); out.push(d); }
  return out;
}
function renderWeekStrip(){
  const el = $("#week");

    let days="";
    for(let i=0;i<7;i++){

}

function exCard(it, plan){
  const id = it.id, ex = LIB[id];
  const rx = prescribe(id, plan.e);
  const d = draft.entries[id];
  const open = ui.open===id;
  const u = unitOf(id);
  const logged = d.sets.length;
  const rxLine = `${it.sets} × ${d.target.reps} ${repWord(id)}${perSide(id)}${logged&&!d.done?` · ${logged}/${it.sets} done`:""}${d.done?` · ${setsText(id,d.sets)}`:""}`;
  const shownW = logged ? Math.max(...d.sets.map(s=>Number(s.w)||0)) : d.target.w;
  return `<article class="ex${d.done?" done":""}${open&&!d.done?" active":""}">
    <button class="ex-main" data-act="open" data-id="${id}" aria-expanded="${open}">

      <span class="ex-w">${ex.bw?`<span class="big" style="font-size:17px;font-family:var(--body);font-weight:500">Mat</span>`:`<span class="big">${shownW}</span><span class="unit">${u}</span>`}${rx.tag&&!logged?`<span class="tag ${rx.cls}">${rx.tag}</span>`:""}</span>
      <span class="ex-rx num">${rxLine}</span>
    </button>
    ${open?flowView(it, plan, d):""}

}

function setList(id, d){

    const editing = ui.editSet && ui.editSet.id===id && ui.editSet.i===i;
    if(editing) return `<div class="setedit">
      <span class="lbl">Edit set ${i+1}</span>
      <div class="row">
        ${bw?"":`<label class="field"><span class="lbl">Weight</span><input id="es-w" type="number" inputmode="decimal" value="${esc(s.w)}"></label>`}
        <label class="field"><span class="lbl">${LIB[id].timed?"Seconds":"Reps"}</span><input id="es-r" type="number" inputmode="numeric" value="${esc(s.reps)}"></label>
      </div>
      <div class="chips">${["easy","right","hard"].map(g=>`<button class="chip" data-act="es-grade" data-v="${g}" aria-pressed="${(ui.editSet.grade||s.grade)===g}">${GRADE[g]}</button>`).join("")}</div>
      <div class="btnrow" style="justify-content:flex-start"><button class="btn sm" data-act="es-save" data-id="${id}">Save set</button><button class="btn ghost sm" data-act="es-cancel">Cancel</button><button class="linkbtn" data-act="es-del" data-id="${id}">Delete this set</button></div>
    </div>`;

  }).join("")}</div>`;
}

function flowView(it, plan, d){
  const id = it.id, ex = LIB[id], u = unitOf(id);
  const n = d.sets.length, total = it.sets + (d.extra||0);
  const ticks = `<div class="ticks" aria-hidden="true">${Array.from({length:Math.max(total,n)},(_,i)=>`<span class="${i<n?"on":i===n&&!d.done?"now":""}"></span>`).join("")}</div>`;
  const cheer = ui.cheer && ui.cheer.id===id ? `<p class="cheer">${esc(ui.cheer.text)}</p>` : "";
  const prevSets = lastSessionSets(id);
  const resting = ui.rest && ui.rest.id===id && n<total && !d.done;
  let body = "";

  if(d.done){
    body = `${setList(id,d)}<p class="cheer">${esc(d.doneLine||"Done, and done well.")}</p>
      <div class="btnrow" style="justify-content:flex-start"><button class="btn ghost sm" data-act="add-set" data-id="${id}">Add another set</button></div>`;
  } else if(resting){
    const r = ui.rest, left = leftOf(r);
    body = `${cheer}
      <div class="timer">
        <div class="ring">${ringSVG("rest-arc", left/r.total)}<div class="clock"><b id="rest-clock">${fmtClock(left)}</b><span>${r.done?"Rest's over":"Rest"}</span></div></div>
        <p class="small muted" id="rest-line">${r.done?`Ready when you are. Set ${n+1} of ${total} is up.`:esc(r.line)}</p>
        <div class="btnrow">${r.done?`<button class="btn" data-act="skip-rest">Start set ${n+1}</button>`:`<button class="btn ghost sm" data-act="add-rest">+15 sec</button><button class="btn sm" data-act="skip-rest">Skip rest</button>`}</div>
      </div>${setList(id,d)}`;
  } else if(n<total){
    const prev = n>0 && prevSets && prevSets[n] ? `Last time set ${n+1}: ${ex.bw?"":prevSets[n].w+" "+u+" × "}${prevSets[n].reps}` : "";
    body = `${n===0?`<p class="cue">${esc(ex.cue)}</p>`:""}${cheer}
      <div class="sethead"><h3>Set ${n+1} <span class="muted" style="font-size:16px">of ${total}</span></h3>${ticks}</div>
      <p class="target">Goal: <b>${ex.bw?"":`${d.target.w} ${u} × `}${d.target.reps}</b> ${repWord(id)}${perSide(id)}${prev?` <span class="muted small">· ${esc(prev)}</span>`:""}</p>
      <div class="steppers"${ex.bw?' style="grid-template-columns:1fr"':""}>
        ${ex.bw?"":`<div class="stepper"><span class="lbl">Weight · ${u}</span><div class="ctl"><button type="button" data-act="adj" data-f="w" data-d="-1" data-id="${id}" aria-label="Less weight">−</button><input id="in-w-${id}" type="text" inputmode="decimal" autocomplete="off" value="${esc(d.inW)}" data-act="inW" data-id="${id}" aria-label="Weight used"><button type="button" data-act="adj" data-f="w" data-d="1" data-id="${id}" aria-label="More weight">+</button></div></div>`}
        <div class="stepper"><span class="lbl">${ex.timed?"Seconds held":"Reps done"}</span><div class="ctl"><button type="button" data-act="adj" data-f="r" data-d="-1" data-id="${id}" aria-label="Fewer">−</button><input id="in-r-${id}" type="text" inputmode="numeric" autocomplete="off" value="${esc(d.inReps)}" data-act="inR" data-id="${id}" aria-label="${ex.timed?"Seconds held":"Reps done"}"><button type="button" data-act="adj" data-f="r" data-d="1" data-id="${id}" aria-label="More">+</button></div></div>
      </div>
      <span class="lbl">Set ${n+1} · how did it feel?</span>
      <div class="logbtns" role="radiogroup">${["easy","right","hard"].map(g=>`<button data-act="pick-grade" data-g="${g}" data-id="${id}" role="radio" aria-pressed="${(d.pick||"right")===g}" aria-checked="${(d.pick||"right")===g}">${GRADE[g]}</button>`).join("")}</div>
      <button class="btn full logset" data-act="log" data-g="${d.pick||"right"}" data-id="${id}" data-rest="${it.rest}" data-total="${total}">Log set ${n+1}</button>
      ${n===0?lastNote(id, prescribe(id, plan.e).msg):""}
      ${n===total-1?`<p class="hint">A hard last set is normal. The coach looks at all your sets together.</p>`:""}
      ${setList(id,d)}`;
  } else {
    body = `${cheer}${setList(id,d)}
      <input id="n-${id}" type="text" aria-label="Note" placeholder="Note: seat height, form cue…" value="${esc(d.note)}" data-act="note" data-id="${id}">
      <button class="btn full" data-act="finish-ex" data-id="${id}">Finish ${esc(ex.name)}</button>
      <div class="btnrow" style="justify-content:flex-start"><button class="linkbtn" data-act="add-set" data-id="${id}">Add another set</button></div>`;
  }
  return `<div class="flow">${body}</div>`;
}
function lastSessionSets(id){
  for(const s of sessions){ if(s.date===TODAY) continue; const x=(s.exercises||[]).find(y=>y.id===id && (y.sets||[]).length); if(x) return x.sets; }
  return null;
}
function bestWeight(id, list){
  let b = 0;
  for(const s of (list||sessions)) for(const x of (s.exercises||[])) if(x.id===id) for(const y of (x.sets||[])) if((Number(y.w)||0)>b) b=Number(y.w)||0;
  return b;
}

/* ---------- progress chart ---------- */
function niceStep(range){ const steps=[5,10,20,25,50]; return steps.find(s=>s>=range/4)||50; }
function chartSVG(pts, id){
  const W=520,H=230,L=40,R=16,T=18,B=30, u=unitOf(id);
  const ws = pts.map(p=>p.w);
  let min = Math.min(...ws), max = Math.max(...ws);
  if(max-min<10){ min-=5; max+=5; }
  const step = niceStep(max-min);
  min = Math.max(0, Math.floor(min/step)*step); max = Math.ceil(max/step)*step;
  const n = pts.length;
  const x = i=> n===1 ? L+(W-L-R)/2 : L+i/(n-1)*(W-L-R);
  const y = v=>T+(1-(v-min)/(max-min))*(H-T-B);
  let g = "";
  for(let v=min; v<=max+0.001; v+=step){ g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--hair)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`; }
  const xy = pts.map((p,i)=>[x(i), y(p.w)]);
  const line = xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area = n>1 ? `<path d="${line} L${xy[n-1][0].toFixed(1)} ${H-B} L${xy[0][0].toFixed(1)} ${H-B} Z" fill="var(--cafe-soft)"/>` : "";
  const labelIdx = n<=5 ? pts.map((_,i)=>i) : [0, Math.floor((n-1)/2), n-1];
  const xl = labelIdx.map(i=>`<text x="${xy[i][0]}" y="${H-8}" text-anchor="${n>1&&i===0?"start":n>1&&i===n-1?"end":"middle"}">${fmtShort(pts[i].date)}</text>`).join("");
  const dots = xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===n-1?4.5:3}" fill="${i===n-1?"var(--rose)":"var(--surface)"}" stroke="${i===n-1?"var(--rose)":"var(--ink)"}" stroke-width="1.2"><title>${fmtShort(pts[i].date)}: ${pts[i].w} ${u}</title></circle>`).join("");
  const lp = xy[n-1];
  const endLabel = `<text x="${n===1?lp[0]:Math.min(lp[0], W-R)}" y="${lp[1]-10}" text-anchor="${n===1?"middle":"end"}" style="fill:var(--ink);font-weight:600">${pts[n-1].w} ${u}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(LIB[id].name)} working weight over time">${g}<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)" stroke-width="1"/>${area}<path d="${line}" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}${endLabel}${xl}</svg>`;
}

function renderProgress(){
  const wkList = [...thisWeek()].sort((a,b)=>String(a.createdAt||a.date).localeCompare(String(b.createdAt||b.date)));
  const visits = []; for(const s of wkList) if(!visits.find(v=>v.date===s.date)) visits.push(s);
  const mins = wkList.reduce((a,s)=>a+(s.minutes||0),0);
  const sets = wkList.reduce((a,s)=>a+(s.exercises||[]).reduce((b,x)=>b+(x.sets||[]).length,0),0);
  const lbs = wkList.reduce((a,s)=>a+(s.exercises||[]).reduce((b,x)=>b+(LIB[x.id]&&!LIB[x.id].bw?(x.sets||[]).reduce((c,y)=>c+(Number(y.w)||0)*(Number(y.reps)||0)*(LIB[x.id].perSide?2:1),0):0),0),0);
  const has = t=>wkList.filter(x=>x.type===t);
  const upperS = has("upper"), lowerS = has("lower"), mixS = has("mix"), thirdS = [...has("recovery"), ...has("light")];
  const slots = [
    {key:"upper", label:"Upper", c:"var(--plum)", soft:"var(--plum-soft)", s:upperS[0] || null},
    {key:"lower", label:"Lower", c:"var(--merlot)", soft:"var(--merlot-soft)", s:lowerS[0] || null},
    {key:"recovery", label:"Recovery", c:"var(--sage)", soft:"var(--sage-soft)", s:thirdS[0] || null}
  ];
  /* a surprise mix fills whichever lifting slot is still open */
  for(const m of mixS){ const open = slots.slice(0,2).find(x=>!x.s); if(open && !slots.some(x=>x.s===m)) open.s = m; }
  const ring = sl=>{
    const v = sl.s;
    if(!v) return `<div class="vring"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" fill="none" stroke="${sl.c}" stroke-opacity=".55" stroke-dasharray="2 4" stroke-width="1.5"/></svg><b>${sl.label}</b><span>Still to come</span></div>`;
    const lbl = v.type==="light" ? "Light day" : v.type==="mix" ? "Surprise mix" : sl.label;
    return `<div class="vring done"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" fill="${sl.soft}" stroke="${sl.c}" stroke-width="3"/><text x="40" y="46" text-anchor="middle" class="vday">${DAYS[parseKey(v.date).getDay()]}</text></svg><b>${lbl}</b><span>${v.minutes||0} min</span></div>`;
  };
  const shown = DX.wk.weeks.filter(w=>w.n>0 || w.key===DX.wk.curKey).slice(-12).reverse();
  let out = `<div class="wrap" style="padding:0">
  <div class="sectionhead"><p class="eyebrow">Your arrangements</p><h2>${esc(MOODS[DX.wk.map[DX.wk.curKey].mood][0])}<span class="muted" style="font-size:15px;font-family:var(--body)"> · this week</span></h2></div>
  <div class="gallery">${shown.map(w=>`<figure class="gcell${w.key===DX.wk.curKey?" now":""}"><svg viewBox="0 0 200 250" role="img" aria-label="${esc(MOODS[w.mood][0])}, ${w.n} of 3 stems">${arrangementSVG(w.mood, w.n, {gold:w.complete, charm:DX.events.some(e=>e.week===w.key)})}</svg><figcaption><i>${w.complete||w.key===DX.wk.curKey?esc(MOODS[w.mood][0]):"Week of"}</i><span>${w.key===DX.wk.curKey?`${w.n} of 3 stems`:fmtShort(w.key)+(w.complete?" · complete":` · ${w.n} of 3`)}</span></figcaption></figure>`).join("")}</div>
  <div class="sectionhead"><p class="eyebrow">This week</p><h2>${Math.min(3,slots.filter(x=>x.s).length)} of 3 visits</h2></div>
  <div class="weekvis">
    <div class="rings">${slots.map(ring).join("")}</div>
    <div class="wkstats"><div><b class="num">${mins}</b><span>minutes</span></div><div><b class="num">${sets}</b><span>sets</span></div><div><b class="num">${Math.round(lbs).toLocaleString()}</b><span>lb lifted</span></div></div>
  </div>`;

  const known = Object.keys(LIB).filter(id=>!LIB[id].bw && (DER.W[id]?.w || DER.H[id]));
  const withHist = known.filter(id=>DER.H[id]);
  if(!ui.chartEx || !known.includes(ui.chartEx)) ui.chartEx = withHist.sort((a,b)=>DER.H[b].length-DER.H[a].length)[0] || known[0] || "legpress";
  const id = ui.chartEx, pts = DER.H[id]||[], u = unitOf(id);
  const gain = pts.length>1 ? pts[pts.length-1].w - pts[0].w : 0;
  out += `<div class="sectionhead"><p class="eyebrow">Strength over time</p><h3>Your working weight, session by session</h3></div>
  <div class="chart">
    <div class="chips">${known.map(k=>`<button class="chip" data-act="chart" data-v="${k}" aria-pressed="${k===id}">${esc(LIB[k].name.replace(/ \(.*\)/,""))}</button>`).join("")}</div>
    <div class="hd"><b>${esc(LIB[id].name)}</b>${pts.length>1?`<span class="gain">${gain>=0?"+":""}${gain} ${u} <span class="small muted" style="font-family:var(--body)">since ${fmtShort(pts[0].date)}</span></span>`:""}</div>
    ${pts.length ? chartSVG(pts,id) : `<div class="empty">Your ${esc(LIB[id].name)} line starts after your first logged session${DER.W[id]?.w?` (starting at ${DER.W[id].w} ${u})`:""}.</div>`}
    ${pts.length===1?`<p class="small muted" style="padding-inline:4px">One point so far. Your line grows every time this exercise comes up.</p>`:""}
  </div>`;

  /* the distinction wall: earned only */
  const groups = {};
  for(const e of DX.events){ const g = groups[e.name] || (groups[e.name] = {name:e.name, count:0, latest:e, first:e.date}); g.count++; if(e.date<g.first) g.first=e.date; }
  const tiles = Object.values(groups).sort((a,b)=>a.latest.date<b.latest.date?1:-1);
  out += `<div class="sectionhead"><p class="eyebrow">The wall</p><h3>${tiles.length} distinction${tiles.length===1?"":"s"} earned</h3><p class="small muted">There are more to find. Keep showing up and they'll appear here.</p></div>
  ${tiles.length?`<div class="wall">${tiles.map(t=>`<div class="tile"><span class="diamond"></span><p class="t">${esc(t.name)}${t.count>1?` <span class="x">× ${t.count}</span>`:""}</p><p class="d">${esc(t.latest.text)}</p><p class="when">${fmtShort(t.latest.date)}</p></div>`).join("")}</div>`:`<div class="empty">Your first distinction is closer than you think.</div>`}`;

  /* working toward: the next few goals, closest first */
  const g = DX.goals.slice(0,5);
  out += `<div class="sectionhead"><p class="eyebrow">Working toward</p></div>
  <div class="miles">${g.map(x=>`<div class="mile"><div class="hd"><b>${esc(x.name)}</b><span>${x.cur} of ${x.goal} ${esc(x.unit)}</span></div><div class="bar"><i style="width:${Math.max(1.5,x.pct*100)}%"></i></div></div>`).join("")}</div>`;

  return out+"</div>";
}

        ${ui.confirmDel===s.id

          : `<div><button class="btn ghost sm" data-act="del-ask" data-id="${esc(s.id)}">Delete workout</button></div>`}

  return out+"</div>";

function programView(){
  const P = programState(), cur = P.next, blockStart = (cur.block-1)*3*BLOCK.length;
  const rows = BLOCK.map((w,k)=>{
    const marks = [0,1,2].map(d=>{ const i = blockStart+k*3+d; return `<span class="pm ${WEEK_DAYS[d]}${P.done.has(i)?" on":""}${i===cur.slot?" now":""}" title="${esc(TYPE_NAME[WEEK_DAYS[d]])}"></span>`; }).join("");
    const reps = w.deload ? "2 easy sets · ~80%" : w.main.lo===w.acc.lo && w.mainSets===w.sets ? `${w.sets} × ${w.main.lo}–${w.main.hi}` : `${w.mainSets} × ${w.main.lo}–${w.main.hi} main · ${w.sets} × ${w.acc.lo}–${w.acc.hi} others`;

  }).join("");
  const upcoming = P.open.map(slotInfo);
  for(let i=Math.max(...P.open)+1; upcoming.length<6; i++) upcoming.push(slotInfo(i));
  return `<div class="sectionhead"><p class="eyebrow">Your program</p><h2>Block ${cur.block}: week ${cur.week} of ${BLOCK.length}</h2><p class="small muted">Goal: strength, health and longevity. Each block builds for five weeks, then eases off for one so the strength sticks.</p></div>
  <div class="prog">${rows}</div>
  <div class="panel" style="gap:10px"><p class="eyebrow">Coming up</p>
    ${upcoming.map((u,n)=>`<div class="upnext"><span class="pill ${u.type}">${esc(TYPE_NAME[u.type])}</span><span class="small muted">${n===0?"Next visit · ":""}Week ${u.week} · ${u.ph.phase}${u.block!==cur.block?` · block ${u.block}`:""}</span></div>`).join("")}
  </div>
  <div class="panel">
    <p><b>How the program works:</b> three sessions per training week: legs & glutes, then chest, back & arms, then recovery. It follows your visits, not the calendar. Miss a day and the same workout waits for you.</p>
    <p><b>Changing today's focus:</b> pick another session from this week and it's a swap; the one you skipped moves to your next visit. Pick anything else and it's a bonus day. It's logged and your weights count, but the program stays put.</p>
    <p><b>How you move up:</b> hit your goal reps on every set and you get +2 reps next time. At the top of the range, the weight goes up and the reps reset. When a new phase changes the rep range, your weights convert automatically.</p>
    <p class="small muted" style="padding-top:14px;border-top:1px solid var(--hair)">Tired days, light days and deload weeks never lower your numbers.</p>
  </div>`;
}

    try{
      const data = JSON.parse(await f.text());

      const list = data.sessions.filter(s=>s && s.id && s.date && /^\d{4}-\d{2}-\d{2}$/.test(s.date)).map(s=>{ const {id,...rest}=s; return Object.assign({id:String(id).replace(/[^A-Za-z0-9_\-.~:@+]/g,"-")}, rest); });

      ui.importPreview = {sessions:list, manual:(data.manual && typeof data.manual==="object")?data.manual:{}, first:dates[0], last:dates[dates.length-1], newCount:list.filter(s=>!have.has(s.id)).length};
      ui.dataMsg = null;
    }catch(e){ ui.importPreview=null; ui.dataMsg="That file isn't a gym coach backup. Choose a .json file you exported from here."; }
    t.value=""; render(); return;
  }
  if(t.dataset.act==="ww"||t.dataset.act==="wr"){
    const v = Number(t.value);
    const m = Object.assign({}, (state.manual||{})[id]||{});
    const cur = DER.W[id]||{};
    m.w = t.dataset.act==="ww" ? (v>0?roundFor(id,v):undefined) : (m.w ?? cur.w);
    m.reps = t.dataset.act==="wr" ? (v>0?Math.round(v):undefined) : (m.reps ?? cur.reps);

function nextLine(id, st){

  if(LIB[id].bw) return c==="reps" ? `up to ${st.reps} ${repWord(id)} next time.` : `repeat ${st.reps} ${repWord(id)} next time.`;
  if(c==="between") return `${st.last.pushed} ${u} was a stretch, so next time is ${st.w} ${u} × ${st.reps}.`;
  if(c==="weight") return `you earned it. Next time ${st.w} ${u} × ${st.reps}.`;
  if(c==="reps") return `next time ${st.w} ${u} × ${st.reps} reps.`;
  if(c==="down") return `easing to ${st.w} ${u} next time so your form stays great.`;
  return `repeat ${st.w} ${u} × ${st.reps} next time and it'll move up.`;
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible"){ if((ui.rest&&!ui.rest.done)||(ui.walkT&&!ui.walkT.done)){ keepAwake(); tick(); } } });

render();
store.init();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
